<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14123A">
  <title>Admin sign in | ZYNO-CONSULT</title>
  <link rel="icon" href="../logo-badge.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="login">
  <div class="login__glow login__glow--a" aria-hidden="true"></div>
  <div class="login__glow login__glow--b" aria-hidden="true"></div>

  <main class="login__card">
    <img class="login__logo" src="../logo-badge.png" width="72" height="72" alt="ZYNO-CONSULT logo">
    <h1>Admin sign in</h1>
    <p class="login__sub">Manage your services and products.</p>

    <div class="alert" id="loginAlert" role="alert" hidden></div>

    <form id="loginForm" novalidate>
          <div class="field">
        <label for="username">Your name</label>
        <input id="username" name="username" type="text" maxlength="30" autocomplete="nickname" spellcheck="false" placeholder="Any name you like" required>
        <p class="field__hint">Type any name. Only the password is checked.</p>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="pw__toggle" id="pwToggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
      </div>

      <button class="btn btn--glow btn--block" id="loginBtn" type="submit">Sign in</button>
    </form>
    <button class="login__forgot" id="forgotBtn" type="button">Forgot password?</button>
    <a class="login__back" href="../index.html">Back to website</a>
  </main>
  <dialog class="dlg" id="resetDlg" aria-labelledby="resetTitle">
    <h2 id="resetTitle">Reset password</h2>
    <p>Enter the recovery key from your web developer, then choose a new password.</p>
    <div class="alert" id="resetAlert" role="alert" hidden></div>
    <form id="resetForm" novalidate>
      <div class="field">
        <label for="rkey">Recovery key</label>
        <input id="rkey" type="password" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="rnew">New password</label>
        <input id="rnew" type="password" autocomplete="new-password">
        <p class="field__hint">At least 8 characters.</p>
      </div>
      <div class="field">
        <label for="rconf">Confirm new password</label>
        <input id="rconf" type="password" autocomplete="new-password">
      </div>
      <div class="dlg__actions">
        <button class="btn btn--ghost" id="resetCancel" type="button">Cancel</button>
        <button class="btn" id="resetBtn" type="submit">Reset password</button>
      </div>
    </form>
  </dialog>
  <script src="../js/auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
